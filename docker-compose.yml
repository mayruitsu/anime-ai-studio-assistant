services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  motion-api:
    build: ./motion-api
    ports:
      - "8090:8090"
    volumes:
      - ${MDM_REPO_PATH}:/workspace/mdm:ro
    gpus: all

  pose-suggestion-api:
    build: ./pose-suggestion-api
    ports:
      - "8093:8093"

  chat-api:
    build: ./chat-api
    ports:
      - "8092:8092"
    environment:
      # コンテナ間はサービス名で通信するため、apiサービスをホスト名で指定する
      - CHAT_API_TOOLS_BASE_URL=http://api:8080
      - CHAT_API_LORA_ADAPTER_DIR=/app/lora_adapter
    volumes:
      - ./chat-api/lora_adapter:/app/lora_adapter:ro
